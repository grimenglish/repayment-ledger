# 이 파일은 예시입니다. 실제 값은 Streamlit Cloud의 Secrets에 입력하세요.
login_mode = "password"
spreadsheet_id = "구글시트_URL의_d와_edit_사이_문자열"
sender_name = "본인 이름"
# Google 로그인 사용 시 login_mode를 google로 변경
allowed_email = "본인@gmail.com"

[login]
salt = "make_password.py로 생성한 salt"
password_hash = "make_password.py로 생성한 password_hash"

[gcp_service_account]
type = "service_account"
project_id = "JSON의 project_id"
private_key_id = "JSON의 private_key_id"
private_key = "-----BEGIN PRIVATE KEY-----\nJSON의 키\n-----END PRIVATE KEY-----\n"
client_email = "JSON의 client_email"
client_id = "JSON의 client_id"
token_uri = "https://oauth2.googleapis.com/token"

# Google 로그인은 아래 세션을 함께 설정하세요.
